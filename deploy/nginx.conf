# HexaLabs marketing site — nginx server block
# Copy to /etc/nginx/sites-available/hexalabs-site, symlink into sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Domain: hexalabs.online. Certificate paths assume certbot (Let's Encrypt).

server {
    listen 80;
    listen [::]:80;
    server_name hexalabs.online www.hexalabs.online;
    return 301 https://hexalabs.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hexalabs.online;

    ssl_certificate     /etc/letsencrypt/live/hexalabs.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexalabs.online/privkey.pem;

    root /var/www/hexalabs-site;
    index index.html;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed build assets never change — cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Images, fonts, icons in /public — cache for a week
    location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages: each route is prerendered to <route>/index.html.
    # Unknown routes fall back to index.html (SPA fallback); the app then
    # renders its own "Page not found" screen.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/index.html /index.html;
    }

    # Optional: return a real 404 status for unknown URLs (better for SEO)
    # instead of the SPA fallback. Swap the try_files line above for:
    #     try_files $uri $uri/index.html =404;
    # and uncomment:
    # error_page 404 /404.html;
}
